name: Publish Arcapush CLI

# Publishes @blindspotlab/arcapush to npm using npm Trusted Publishing (OIDC)
# and creates a matching GitHub Release for tag-triggered releases.
# No NPM_TOKEN / NODE_AUTH_TOKEN is used — authentication is performed via the
# GitHub Actions OIDC id-token exchange (requires npm >= 11.5.1; we pin >= 11.15.0).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          # Package-manager caching is intentionally disabled for release builds
          # (no `cache:` input) to guarantee a clean, reproducible install.

      - name: Ensure npm is new enough for Trusted Publishing (OIDC)
        run: |
          npm install -g "npm@^11.15.0"
          node --version
          npm --version

      - name: Validate tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package.json ($PACKAGE_VERSION)."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Pack (dry run)
        run: npm pack --dry-run

      - name: Publish to npm (Trusted Publishing / OIDC)
        run: npm publish --access public

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
