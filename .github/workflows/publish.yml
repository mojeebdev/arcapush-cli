name: Publish Arcapush CLI
on:
  push:
    tags: ['v*']
    branches: ['release/0.2.0']
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
concurrency:
  group: arcapush-cli-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Install npm with Trusted Publishing support
        run: npm install -g 'npm@^11.15.0'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm pack --dry-run
      - name: Check release and API compatibility
        id: release
        run: node scripts/release-preflight.mjs
      - name: Publish through npm Trusted Publishing
        if: steps.release.outputs.exists != 'true'
        env:
          RELEASE_CHANNEL: ${{ steps.release.outputs.channel }}
        run: npm publish --access public --tag "$RELEASE_CHANNEL" --provenance
      - name: Create release with human and agent-readable notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_CHANNEL: ${{ steps.release.outputs.channel }}
        shell: bash
        run: |
          TAG="v$RELEASE_VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists."
            exit 0
          fi
          OPTIONS=()
          if [ "$RELEASE_CHANNEL" = "next" ]; then OPTIONS+=(--prerelease); fi
          gh release create "$TAG" --target "$GITHUB_SHA" \
            --title "Arcapush CLI $RELEASE_VERSION: CLI + MCP" \
            --notes-file CHANGELOG.md "${OPTIONS[@]}"
