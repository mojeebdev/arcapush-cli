name: Publish Arcapush CLI
# Releases come from a tag naming the exact package version (vX.Y.Z), or a
# manual run on main. scripts/release-preflight.mjs enforces both, checks the
# shown CLI version, lockfile and CHANGELOG section, and refuses to overwrite
# a published version. Stable versions publish to npm latest and GitHub Latest.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['package.json']
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
concurrency:
  group: arcapush-cli-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Install npm with Trusted Publishing support
        run: npm install -g 'npm@^11.15.0'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm pack --dry-run
      - name: Check release and API compatibility
        id: release
        run: node scripts/release-preflight.mjs
      - name: Publish through npm Trusted Publishing
        if: steps.release.outputs.exists != 'true'
        env:
          RELEASE_CHANNEL: ${{ steps.release.outputs.channel }}
        run: npm publish --access public --tag "$RELEASE_CHANNEL" --provenance
      - name: Verify the stable npm release
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          # npm can accept a publish before its metadata becomes public.
          LATEST=unavailable
          for attempt in $(seq 1 30); do
            if LATEST=$(npm view @blindspotlab/arcapush dist-tags.latest --prefer-online --fetch-retries=0 --fetch-timeout=10000); then
              if [ "$LATEST" = "$RELEASE_VERSION" ]; then exit 0; fi
            fi
            echo "Waiting for npm processing ($attempt/30): latest=$LATEST"
            sleep 10
          done
          echo "npm latest is $LATEST, expected $RELEASE_VERSION. Check processing and tags, then rerun this workflow."
          exit 1
      - name: Create release with human and agent-readable notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_CHANNEL: ${{ steps.release.outputs.channel }}
        shell: bash
        run: |
          TAG="v$RELEASE_VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --prerelease=false --latest \
              --title "Arcapush CLI $RELEASE_VERSION: CLI + MCP" \
              --notes-file release-notes.md
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --latest \
              --title "Arcapush CLI $RELEASE_VERSION: CLI + MCP" \
              --notes-file release-notes.md
          fi
